name: smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap smoke
        run: ./tests/smoke.sh
      - name: init.sh smoke
        run: ./tests/init-smoke.sh
      - name: obsidian-defaults paths
        run: ./tests/obsidian-defaults-paths.sh
      - name: repo-session hermetic test
        run: ./tests/repo-session-test.sh
      - name: update engine (classification, conflicts, migrations, restore)
        run: ./tests/migrate-test.sh
      - name: update check (offline, cache, notice)
        run: ./tests/update-check-test.sh
      - name: feedback throttle
        run: ./tests/feedback-throttle-test.sh
